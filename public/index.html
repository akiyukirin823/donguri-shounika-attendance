<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>どんぐり小児科 出退勤</title>
<style>
body{font-family:system-ui,sans-serif;background:#f6f1e7;margin:0;color:#374233}
main{max-width:560px;margin:auto;padding:24px}.card{background:#fffdf8;border-radius:24px;padding:24px;box-shadow:0 8px 28px #00000012}
h1{font-size:24px}.btn{width:100%;padding:16px;margin:7px 0;border:0;border-radius:16px;font-size:18px;background:#6f8b58;color:white}.sub{background:#d9b56d}.danger{background:#a86d62}.muted{color:#777}.row{display:flex;gap:8px}.row>*{flex:1}
</style></head>
<body><main><div class="card">
<h1>🌰 どんぐり小児科<br>出退勤アプリ</h1>
<p id="status" class="muted">LINEログインを確認しています…</p>
<div id="app" hidden>
<button class="btn" onclick="clock('in')">出勤</button>
<button class="btn danger" onclick="clock('out')">退勤</button>
<div class="row"><button class="btn sub" onclick="clock('break-start')">休憩開始</button><button class="btn sub" onclick="clock('break-end')">休憩終了</button></div>
<button class="btn sub" onclick="share()">LINEで共有</button>
<pre id="result"></pre></div></div></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
let token="";
async function boot(){
 const c=await fetch('/config.js').then(r=>r.json());
 await liff.init({liffId:c.liffId});
 if(!liff.isLoggedIn()){liff.login();return}
 const idToken=liff.getIDToken();
 const r=await fetch('/api/auth/line',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken})});
 const j=await r.json(); if(!r.ok) throw new Error(j.error||'login failed');
 token=j.token; document.querySelector('#status').textContent=j.employee.name+' さん';
 document.querySelector('#app').hidden=false;
}
async function clock(action){
 const r=await fetch('/api/attendance/action',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({action})});
 const j=await r.json(); document.querySelector('#result').textContent=JSON.stringify(j,null,2);
}
async function share(){
 const text='どんぐり小児科の出退勤を確認しました。';
 if(liff.isApiAvailable('shareTargetPicker')) await liff.shareTargetPicker([{type:'text',text}]);
 else if(navigator.share) await navigator.share({text});
 else alert(text);
}
boot().catch(e=>document.querySelector('#status').textContent='エラー: '+e.message);
</script></body></html>
